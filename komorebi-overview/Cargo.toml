[package]
name = "komorebi-overview"
version = "0.1.0"
edition = "2024"
description = "Hyprland-style workspace overview for komorebi"

[dependencies]
komorebi-client = { path = "../komorebi-client", default-features = false }
serde_json = { workspace = true }
windows-core = { workspace = true }
windows-numerics = { workspace = true }

[dependencies.windows]
workspace = true
features = [
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Imaging_D2D",
  "Win32_Storage_Xps",
  "Win32_System_Com",
]
